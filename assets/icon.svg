<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Dark background -->
  <rect width="256" height="256" rx="52" fill="#0d0f14"/>

  <!-- Subtle branch silhouette left -->
  <g fill="#1a1e2a" opacity="0.9">
    <ellipse cx="30" cy="60" rx="28" ry="4" transform="rotate(-30 30 60)"/>
    <ellipse cx="20" cy="80" rx="20" ry="3" transform="rotate(-45 20 80)"/>
    <ellipse cx="50" cy="40" rx="22" ry="3" transform="rotate(-20 50 40)"/>
    <ellipse cx="15" cy="100" rx="18" ry="2.5" transform="rotate(-60 15 100)"/>
    <ellipse cx="40" cy="25" rx="16" ry="2" transform="rotate(-15 40 25)"/>
    <circle cx="10" cy="55" r="5"/>
    <circle cx="25" cy="35" r="4"/>
    <circle cx="55" cy="20" r="3.5"/>
    <circle cx="8"  cy="90" r="3"/>
    <circle cx="38" cy="105" r="3"/>
  </g>

  <!-- Subtle branch silhouette right -->
  <g fill="#1a1e2a" opacity="0.9">
    <ellipse cx="226" cy="60" rx="28" ry="4" transform="rotate(30 226 60)"/>
    <ellipse cx="236" cy="80" rx="20" ry="3" transform="rotate(45 236 80)"/>
    <ellipse cx="206" cy="40" rx="22" ry="3" transform="rotate(20 206 40)"/>
    <ellipse cx="241" cy="100" rx="18" ry="2.5" transform="rotate(60 241 100)"/>
    <ellipse cx="216" cy="25" rx="16" ry="2" transform="rotate(15 216 25)"/>
    <circle cx="246" cy="55" r="5"/>
    <circle cx="231" cy="35" r="4"/>
    <circle cx="201" cy="20" r="3.5"/>
    <circle cx="248" cy="90" r="3"/>
    <circle cx="218" cy="105" r="3"/>
  </g>

  <!-- Bottom branches -->
  <g fill="#1a1e2a" opacity="0.9">
    <ellipse cx="128" cy="230" rx="60" ry="3.5" transform="rotate(5 128 230)"/>
    <ellipse cx="80"  cy="240" rx="40" ry="3"   transform="rotate(-10 80 240)"/>
    <ellipse cx="176" cy="238" rx="38" ry="3"   transform="rotate(12 176 238)"/>
    <circle cx="60"  cy="245" r="4"/>
    <circle cx="100" cy="248" r="3.5"/>
    <circle cx="160" cy="244" r="3.5"/>
    <circle cx="196" cy="242" r="4"/>
  </g>

  <!-- Pentagram star — white outline, no fill, matching logo -->
  <!-- Outer points of a 5-point star centered at 128,122, radius 88 -->
  <!-- Inner radius ~34, drawn as two overlapping polygons for the outline effect -->

  <!-- Glow layer -->
  <polygon
    points="128,34 152,104 226,104 168,148 190,218 128,174 66,218 88,148 30,104 104,104"
    fill="none"
    stroke="#3b82f6"
    stroke-width="3"
    stroke-linejoin="miter"
    opacity="0.25"
    filter="url(#glow)"
  />

  <!-- Main star outline -->
  <polygon
    points="128,34 152,104 226,104 168,148 190,218 128,174 66,218 88,148 30,104 104,104"
    fill="none"
    stroke="#e8eaf0"
    stroke-width="5"
    stroke-linejoin="miter"
  />

  <!-- Inner pentagram crossing lines — connect tips skipping one -->
  <polyline
    points="128,34 190,218 30,104 226,104 66,218 128,34"
    fill="none"
    stroke="#e8eaf0"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
